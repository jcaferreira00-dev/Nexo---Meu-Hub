<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo — Hub de Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #EEF0F6;
    --panel: #FFFFFF;
    --panel-2: #F7F8FC;
    --text: #171A23;
    --text-dim: #6B7085;
    --border: #DBDEE8;
    --border-strong: #C3C8D8;
    --shadow: 0 6px 18px rgba(23,26,35,0.06);
    --shadow-lg: 0 18px 40px rgba(23,26,35,0.12);
    --accent: #6D5EF0;
  }
  [data-theme="dark"] {
    --bg: #0A0B10;
    --panel: #15171F;
    --panel-2: #1C1F2A;
    --text: #F0F1F7;
    --text-dim: #9BA0B4;
    --border: #2C2F3D;
    --border-strong: #454A62;
    --shadow: 0 6px 18px rgba(0,0,0,0.45);
    --shadow-lg: 0 22px 50px rgba(0,0,0,0.6);
  }

  body {
    font-family:'Inter',sans-serif; color:var(--text); min-height:100vh;
    transition:background .3s ease,color .3s ease; position:relative;
    background: var(--bg);
  }
  [data-theme="dark"] body {
    background: radial-gradient(ellipse 1200px 700px at 20% -10%, #1a1d2b 0%, transparent 55%),
                radial-gradient(ellipse 900px 600px at 100% 10%, #171b26 0%, transparent 50%),
                var(--bg);
  }

  .ambient { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55; transition:opacity .3s ease; }
  .ambient::before, .ambient::after { content:""; position:absolute; width:520px; height:520px; border-radius:50%; filter:blur(90px); }
  .ambient::before { background:#6D5EF0; opacity:.10; top:-140px; left:-120px; }
  .ambient::after { background:#10B981; opacity:.08; bottom:-160px; right:-100px; }
  [data-theme="dark"] .ambient::before { opacity:.22; }
  [data-theme="dark"] .ambient::after { opacity:.16; }

  .shell { display:flex; min-height:100vh; position:relative; z-index:1; }

  /* SIDEBAR */
  .sidebar { width:246px; flex-shrink:0; padding:26px 18px; display:flex; flex-direction:column; border-right:1px solid var(--border); background:var(--panel); transition:background .3s ease,border-color .3s ease; }
  [data-theme="dark"] .sidebar { box-shadow: inset -1px 0 0 rgba(255,255,255,0.03); }
  [data-theme="dark"] .search,
  [data-theme="dark"] .detail-panel,
  [data-theme="dark"] .fav-chip,
  [data-theme="dark"] .m-row,
  [data-theme="dark"] .stat-chip,
  [data-theme="dark"] .theme-pill { box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), var(--shadow); }
  .brand { display:flex; align-items:center; gap:12px; padding:4px 8px 30px; }
  .brand-mark { width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#4C6FFF,#8B5CF6); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; }
  .brand-mark svg { width:20px; height:20px; }
  .brand-name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; }
  .brand-sub { font-size:11.5px; color:var(--text-dim); }
  .nav { display:flex; flex-direction:column; gap:3px; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px; color:var(--text-dim); font-size:14px; font-weight:500; cursor:pointer; border:1px solid transparent; transition:background .15s,color .15s,border-color .15s; }
  .nav-item .material-symbols-outlined { font-size:20px; }
  .nav-item:hover { background:var(--panel-2); border-color:var(--border); color:var(--text); }
  .nav-item.active { background:var(--panel-2); color:var(--accent); border-color:#6D5EF055; font-weight:600; }
  .nav-spacer { flex:1; }
  .nav-bottom { display:flex; flex-direction:column; gap:3px; padding-top:14px; border-top:1px solid var(--border); }

  /* MAIN */
  .main { flex:1; min-width:0; padding:26px 40px 70px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:22px; flex-wrap:wrap; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .greeting-wave { font-size:14px; color:var(--text-dim); margin-bottom:3px; }
  .greeting h1 { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:23px; letter-spacing:-0.01em; }
  .greeting p { font-size:13px; color:var(--text-dim); margin-top:4px; }
  .topbar-right { display:flex; align-items:center; gap:14px; }
  .search { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 16px; width:260px; color:var(--text-dim); font-size:14px; }
  .search:focus-within { border-color:var(--accent); }
  .search .material-symbols-outlined { font-size:19px; }
  .search input { border:none; outline:none; background:transparent; font-family:inherit; font-size:14px; color:var(--text); width:100%; }
  .search input::placeholder { color:var(--text-dim); }
  .avatar { width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,#4C6FFF,#8B5CF6); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; position:relative; flex-shrink:0; }
  .avatar::after { content:""; position:absolute; bottom:-3px; right:-3px; width:11px; height:11px; border-radius:50%; background:#34D399; border:2px solid var(--panel); }

  .status-strip { display:flex; gap:20px; margin-bottom:26px; font-size:12.5px; color:var(--text-dim); flex-wrap:wrap; }
  .status-strip b { color:var(--text); }
  .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; }
  .status-dot.on { background:#34D399; box-shadow:0 0 6px #34D399aa; }

  /* HUB ROW */
  .hub-row { display:flex; gap:28px; align-items:stretch; margin-bottom:34px; }
  .wheel-col { flex-shrink:0; display:flex; flex-direction:column; align-items:center; position:relative; }
  .wheel-wrap { position:relative; width:440px; height:440px; }

  .wheel-ring { position:absolute; inset:0; border-radius:50%; box-shadow:0 0 0 3px var(--panel), 0 0 0 5px var(--border-strong), var(--shadow-lg); overflow:hidden; }
  [data-theme="dark"] .wheel-ring { box-shadow:0 0 0 3px var(--panel), 0 0 0 5px var(--border-strong), 0 0 70px -10px rgba(109,94,240,0.35), var(--shadow-lg); }
  .wheel-sheen { position:absolute; inset:-40%; border-radius:50%; background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.16) 8deg, transparent 20deg, transparent 360deg); animation: sweep 9s linear infinite; pointer-events:none; }
  [data-theme="dark"] .wheel-sheen { background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.08) 8deg, transparent 20deg, transparent 360deg); }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .wheel-dividers { position:absolute; inset:0; border-radius:50%; pointer-events:none; }

  .spoke { position:absolute; left:50%; top:50%; height:2px; width:0; transform-origin:0 50%; background:linear-gradient(90deg, currentColor, transparent); opacity:0; transition:width .3s ease, opacity .3s ease; pointer-events:none; }
  .spoke.show { opacity:.55; }

  .wheel-hole { position:absolute; inset:82px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px; box-shadow:inset 0 0 0 2px var(--border-strong), var(--shadow); text-align:center; padding:10px; z-index:2; }
  .wheel-hole .wh-icon { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:6px; border:1.5px solid var(--border-strong); transition:border-color .2s ease, background .2s ease; }
  .wheel-hole .wh-icon .material-symbols-outlined { font-size:18px; }
  .wheel-hole h5 { font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:600; max-width:150px; line-height:1.25; }
  .wheel-hole span { font-size:11px; color:var(--text-dim); }
  .hole-content { opacity:0; transform:scale(.5) translateY(6px); transition: transform .38s cubic-bezier(.34,1.56,.64,1), opacity .22s ease; display:flex; flex-direction:column; align-items:center; }
  .hole-content.pop { opacity:1; transform:scale(1) translateY(0); }

  .app-node { position:absolute; width:70px; height:70px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); cursor:pointer; transform:translate(-50%,-50%) scale(0); transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, border-color .18s ease; border:2.5px solid var(--border-strong); z-index:2; }
  .app-node.in { transform:translate(-50%,-50%) scale(1); }
  .app-node:hover { transform:translate(-50%,-50%) scale(1.1); }
  .app-node.active:hover, .app-node.active { transform:translate(-50%,-50%) scale(1.15); }
  .app-node:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .app-node .material-symbols-outlined { font-size:27px; }
  .app-node.active { box-shadow: 0 0 0 5px currentColor22, var(--shadow-lg); }
  .app-node.dimmed { opacity:.2; pointer-events:none; }
  .app-node.placeholder { border-style:dashed; }

  .app-dot { position:absolute; width:7px; height:7px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--panel); z-index:2; }

  /* DETAIL PANEL */
  .detail-panel { flex:1; min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:26px; display:flex; flex-direction:column; box-shadow:var(--shadow); }
  .detail-empty { margin:auto; text-align:center; color:var(--text-dim); font-size:13.5px; max-width:280px; }
  .detail-empty .material-symbols-outlined { font-size:30px; display:block; margin:0 auto 10px; color:var(--border-strong); }

  .detail-head { display:flex; align-items:flex-start; gap:16px; margin-bottom:18px; }
  .detail-icon { width:54px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; border:2px solid var(--border-strong); flex-shrink:0; }
  .detail-icon .material-symbols-outlined { font-size:26px; }
  .detail-title h2 { font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:600; margin-bottom:4px; }
  .detail-title .tag { font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:5px; }
  .detail-title .tag .material-symbols-outlined { font-size:13px; }

  .detail-desc { font-size:13.5px; color:var(--text-dim); line-height:1.6; margin-bottom:20px; }

  .detail-meta { display:flex; gap:22px; margin-bottom:22px; flex-wrap:wrap; }
  .meta-item { font-size:12px; color:var(--text-dim); }
  .meta-item b { display:block; color:var(--text); font-size:13.5px; font-weight:600; margin-top:2px; }

  .detail-actions { display:flex; gap:10px; margin-top:auto; flex-wrap:wrap; }
  .btn { display:flex; align-items:center; gap:8px; border-radius:12px; padding:11px 18px; font-size:13.5px; font-weight:600; cursor:pointer; border:1.5px solid var(--border-strong); transition:opacity .15s ease, background .15s ease, color .15s ease, border-color .15s ease; }
  .btn .material-symbols-outlined { font-size:18px; }
  .btn-primary { background:var(--text); color:var(--bg); border-color:var(--text); }
  .btn-primary:hover { opacity:.85; }
  .btn-primary.is-disabled { opacity:.4; cursor:default; pointer-events:none; }
  .btn-ghost { background:transparent; color:var(--text); }
  .btn-ghost.is-fav { background:#F43F5E14; border-color:#F43F5E55; color:#F43F5E; }
  .btn-ghost:hover { background:var(--panel-2); }
  .btn-ghost.copied { background:#10B98118; border-color:#10B98155; color:#10B981; }

  .stats-row { display:flex; gap:14px; flex-wrap:wrap; margin-top:16px; justify-content:center; }
  .stat-chip { border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:12px; color:var(--text-dim); }
  .stat-chip b { color:var(--text); font-size:14px; display:block; }

  .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .section-head h3 { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; }
  .fav-row { display:flex; gap:10px; flex-wrap:wrap; min-height:44px; }
  .fav-chip { display:flex; align-items:center; gap:8px; background:var(--panel); border:1.5px solid var(--border-strong); border-radius:11px; padding:9px 14px; font-size:13px; font-weight:500; cursor:pointer; transition:transform .15s ease, border-color .15s ease; }
  .fav-chip:hover { transform:translateY(-1px); }
  .fav-chip .material-symbols-outlined { font-size:17px; }
  .fav-empty { font-size:12.5px; color:var(--text-dim); padding:10px 2px; }

  .mobile-list { display:none; flex-direction:column; gap:10px; }
  .m-row { display:flex; align-items:center; gap:14px; background:var(--panel); border:1.5px solid var(--border-strong); border-radius:14px; padding:14px 16px; cursor:pointer; }
  .m-row .m-icon { width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--border-strong); flex-shrink:0; }
  .m-row h4 { font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; }
  .m-row p { font-size:11.5px; color:var(--text-dim); }
  .m-row.hidden-row { display:none; }

  .theme-pill { position:fixed; right:30px; bottom:26px; display:flex; background:var(--panel); border:1.5px solid var(--border-strong); border-radius:100px; padding:5px; box-shadow:var(--shadow-lg); z-index:10; }
  .theme-pill .opt { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:500; color:var(--text-dim); cursor:pointer; }
  .theme-pill .opt .material-symbols-outlined { font-size:16px; }
  .theme-pill .opt.selected { background:var(--panel-2); color:var(--text); border:1px solid var(--border-strong); }

  @media (max-width:1080px) {
    .hub-row { flex-direction:column; align-items:center; }
    .wheel-wrap { width:380px; height:380px; }
    .wheel-hole { inset:72px; }
    .detail-panel { width:100%; }
  }
  @media (max-width:900px) { .sidebar { display:none; } .main { padding:20px 20px 90px; } }
  @media (max-width:620px) {
    .wheel-col { display:none; }
    .mobile-list { display:flex; }
    .search { width:100%; }
    .topbar-right { width:100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body data-theme="light">
<div class="ambient"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="6" cy="6" r="2.4" fill="#fff"/>
          <circle cx="18" cy="6" r="2.4" fill="#fff" fill-opacity="0.55"/>
          <circle cx="6" cy="18" r="2.4" fill="#fff" fill-opacity="0.55"/>
          <circle cx="18" cy="18" r="2.4" fill="#fff"/>
          <path d="M6 6L18 18M18 6L6 18" stroke="#fff" stroke-opacity="0.5" stroke-width="1.3"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Nexo</div>
        <div class="brand-sub">meu hub de apps</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-item active"><span class="material-symbols-outlined">grid_view</span>Início</div>
      <div class="nav-item"><span class="material-symbols-outlined">star</span>Favoritos</div>
      <div class="nav-item"><span class="material-symbols-outlined">history</span>Recentes</div>
      <div class="nav-item"><span class="material-symbols-outlined">payments</span>Finanças</div>
    </nav>
    <div class="nav-spacer"></div>
    <div class="nav-bottom">
      <div class="nav-item"><span class="material-symbols-outlined">settings</span>Configurações</div>
      <div class="nav-item"><span class="material-symbols-outlined">logout</span>Sair</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="greeting">
        <div class="greeting-wave">Olá, 👋</div>
        <h1>Bem-vindo ao seu hub</h1>
        <p>Clique em um app no anel pra ver detalhes, favoritar ou abrir.</p>
      </div>
      <div class="topbar-right">
        <div class="search">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="searchInput" placeholder="Buscar aplicativos...">
        </div>
        <div class="avatar">J</div>
      </div>
    </div>

    <div class="status-strip">
      <div><span class="status-dot on"></span><b>6</b> apps com link ativo</div>
      <div><b id="favCountTop">0</b> favoritos</div>
    </div>

    <div class="hub-row">
      <div class="wheel-col">
        <div class="wheel-wrap" id="wheelWrap">
          <div class="wheel-ring" id="wheelRing"><div class="wheel-sheen"></div></div>
          <div class="wheel-dividers" id="wheelDividers"></div>
          <div class="wheel-hole" id="wheelHole"></div>
        </div>
      </div>
      <div class="detail-panel" id="detailPanel"></div>
      <div class="mobile-list" id="mobileList"></div>
    </div>

    <div class="section-head">
      <h3>Favoritos</h3>
      <span id="favCount" style="font-size:12.5px;color:var(--text-dim);"></span>
    </div>
    <div class="fav-row" id="favRow"></div>
  </main>
</div>

<div class="theme-pill" id="themePill">
  <span class="opt" id="optLight"><span class="material-symbols-outlined">light_mode</span>Claro</span>
  <span class="opt" id="optDark"><span class="material-symbols-outlined">dark_mode</span>Escuro</span>
</div>

<script>
  const apps = [
    { name:"Gestão Financeira", sub:"Acompanha receitas, contas do mês, cartões de crédito e dívidas em um único painel.", icon:"account_balance_wallet", color:"#F59E0B", status:"online", last:"Hoje", fav:false, url:"https://jcaferreira00-dev.github.io/GASTOS-MENSAIS/" },
    { name:"Tem Direito?", sub:"Calculadoras gratuitas para descobrir benefícios sociais como PIS/Pasep, FGTS e Bolsa Família.", icon:"balance", color:"#E11D48", status:"online", last:"Ontem", fav:true, url:"https://consultarbeneficios.com.br/" },
    { name:"Meu Bolso", sub:"Organiza o orçamento em envelopes digitais, mês a mês, sem depender de nuvem.", icon:"savings", color:"#8B5CF6", status:"online", last:"Há 2 dias", fav:true, url:"https://jcaferreira00-dev.github.io/MeuBolso/" },
    { name:"Holerite", sub:"Calcula o salário líquido com IRRF, INSS, horas extras e adiantamento personalizados.", icon:"receipt_long", color:"#06B6D4", status:"online", last:"Há 1 semana", fav:false, url:"https://jcaferreira00-dev.github.io/cardHolerite/" },
    { name:"Patrimônio", sub:"Reúne investimentos, imóveis e dívidas, com cotações atualizadas via Brapi.", icon:"trending_up", color:"#10B981", status:"online", last:"Há 4 dias", fav:false, url:"https://jcaferreira00-dev.github.io/Patrimonio/" },
    { name:"Minhas Contas", sub:"Controla receitas e pagamentos mês a mês, com fechamento e histórico.", icon:"account_balance", color:"#3B82F6", status:"online", last:"Há 3 dias", fav:false, url:"https://jcaferreira00-dev.github.io/ContasdoMes/" },
    { name:"Novo app", sub:"Reserve esse espaço pro próximo app que você lançar.", icon:"add", color:"#94A3B8", status:"empty", last:"—", fav:false, url:null },
  ];

  let selected = null;

  const wrap = document.getElementById('wheelWrap');
  const ring = document.getElementById('wheelRing');
  const dividers = document.getElementById('wheelDividers');
  const size = 440, center = size/2;
  const nodeRadius = 170, dotRadius = 205;
  const step = 360 / apps.length;

  const stops = apps.map((a,i)=>`${a.color} ${i*step + step/2}deg`).join(', ');
  ring.style.background = `conic-gradient(from 0deg, ${stops}, ${apps[0].color} ${360+step/2}deg)`;

  let divStr = apps.map((a,i)=>{
    const b = i*step;
    return `transparent ${b-0.6}deg, var(--panel) ${b-0.6}deg, var(--panel) ${b+0.6}deg, transparent ${b+0.6}deg`;
  }).join(', ');
  dividers.style.background = `conic-gradient(from 0deg, ${divStr})`;

  const nodeEls = [], spokeEls = [];

  apps.forEach((app, i) => {
    const angle = i*step + step/2;
    const rad = angle*Math.PI/180;
    const dx = Math.sin(rad), dy = -Math.cos(rad);

    const spoke = document.createElement('div');
    spoke.className = 'spoke';
    spoke.style.color = app.color;
    spoke.style.left = center + 'px';
    spoke.style.top = center + 'px';
    spoke.style.transform = `rotate(${angle-90}deg)`;
    wrap.appendChild(spoke);
    spokeEls.push({el:spoke, len: nodeRadius - 20});

    const node = document.createElement('div');
    node.className = 'app-node' + (app.status === 'empty' ? ' placeholder' : '');
    node.tabIndex = 0;
    node.style.left = (center + dx*nodeRadius) + 'px';
    node.style.top = (center + dy*nodeRadius) + 'px';
    node.style.borderColor = app.color + 'aa';
    node.style.color = app.color;
    node.innerHTML = `<span class="material-symbols-outlined" style="color:${app.color}">${app.icon}</span>`;
    node.addEventListener('click', () => selectApp(i));
    node.addEventListener('keydown', (e) => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectApp(i);} });
    wrap.appendChild(node);
    nodeEls.push(node);
    setTimeout(()=>node.classList.add('in'), 60 + i*55);

    const dot = document.createElement('div');
    dot.className = 'app-dot';
    dot.style.background = app.color;
    dot.style.left = (center + dx*dotRadius) + 'px';
    dot.style.top = (center + dy*dotRadius) + 'px';
    wrap.appendChild(dot);
  });

  const mobileList = document.getElementById('mobileList');
  const mRows = [];
  apps.forEach((app,i)=>{
    const row = document.createElement('div');
    row.className = 'm-row';
    row.innerHTML = `
      <div class="m-icon" style="background:${app.color}18;"><span class="material-symbols-outlined" style="color:${app.color}">${app.icon}</span></div>
      <div><h4>${app.name}</h4><p>${app.sub.slice(0,50)}${app.sub.length>50?'…':''}</p></div>`;
    row.addEventListener('click', ()=>selectApp(i));
    mobileList.appendChild(row);
    mRows.push(row);
  });

  function hostname(url) { try { return new URL(url).hostname; } catch(e) { return ''; } }

  function renderWheelCenter() {
    const hole = document.getElementById('wheelHole');
    let inner;
    if (selected === null) {
      const onlineCount = apps.filter(a=>a.status==='online').length;
      inner = `<div class="wh-icon"><span class="material-symbols-outlined">apps</span></div><h5>${apps.length-1} apps</h5><span>${onlineCount} online</span>`;
    } else {
      const app = apps[selected];
      inner = `<div class="wh-icon" style="background:${app.color}18;border-color:${app.color}88;"><span class="material-symbols-outlined" style="color:${app.color}">${app.icon}</span></div><h5>${app.name}</h5><span>${app.status==='online'?'online':'reservado'}</span>`;
    }
    hole.innerHTML = `<div class="hole-content">${inner}</div>`;
    const content = hole.querySelector('.hole-content');
    requestAnimationFrame(() => requestAnimationFrame(() => content.classList.add('pop')));
  }

  function renderDetail() {
    const panel = document.getElementById('detailPanel');
    if (selected === null) {
      const favCount = apps.filter(a=>a.fav).length;
      panel.innerHTML = `
        <div class="detail-empty">
          <span class="material-symbols-outlined">touch_app</span>
          Clique em um app no anel ao lado pra ver detalhes, favoritar ou abrir.
          <div class="stats-row">
            <div class="stat-chip"><b>${apps.length-1}</b>apps</div>
            <div class="stat-chip"><b>${favCount}</b>favoritos</div>
          </div>
        </div>`;
      return;
    }
    const app = apps[selected];
    const isEmpty = app.status === 'empty';
    panel.innerHTML = `
      <div class="detail-head">
        <div class="detail-icon" style="background:${app.color}18;border-color:${app.color}88;">
          <span class="material-symbols-outlined" style="color:${app.color}">${app.icon}</span>
        </div>
        <div class="detail-title">
          <h2>${app.name}</h2>
          <div class="tag">${isEmpty ? 'sem link ainda' : `<span class="material-symbols-outlined">link</span>${hostname(app.url)}`}</div>
        </div>
      </div>
      <div class="detail-desc">${app.sub}</div>
      <div class="detail-meta">
        <div class="meta-item">Status<b>${isEmpty ? '—' : 'Online'}</b></div>
        <div class="meta-item">Último acesso<b>${app.last}</b></div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-primary ${isEmpty ? 'is-disabled' : ''}" id="openBtn">
          <span class="material-symbols-outlined">open_in_new</span>${isEmpty ? 'Em breve' : 'Abrir aplicativo'}
        </button>
        ${!isEmpty ? `<button class="btn btn-ghost ${app.fav ? 'is-fav' : ''}" id="favBtn">
          <span class="material-symbols-outlined">${app.fav ? 'favorite' : 'favorite_border'}</span>${app.fav ? 'Favoritado' : 'Favoritar'}
        </button>
        <button class="btn btn-ghost" id="copyBtn">
          <span class="material-symbols-outlined">content_copy</span>Copiar link
        </button>` : ''}
      </div>`;

    if (!isEmpty) {
      document.getElementById('favBtn').addEventListener('click', () => { app.fav = !app.fav; renderDetail(); renderFavorites(); });
      document.getElementById('openBtn').addEventListener('click', () => window.open(app.url, '_blank', 'noopener'));
      document.getElementById('copyBtn').addEventListener('click', (e) => {
        navigator.clipboard.writeText(app.url).then(() => {
          const btn = e.currentTarget;
          btn.classList.add('copied');
          btn.innerHTML = `<span class="material-symbols-outlined">check</span>Copiado`;
          setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = `<span class="material-symbols-outlined">content_copy</span>Copiar link`; }, 1600);
        });
      });
    }
  }

  function renderFavorites() {
    const row = document.getElementById('favRow');
    const favApps = apps.map((a,i)=>({...a,i})).filter(a=>a.fav);
    document.getElementById('favCount').textContent = favApps.length + (favApps.length===1 ? ' app' : ' apps');
    document.getElementById('favCountTop').textContent = favApps.length;
    if (!favApps.length) {
      row.innerHTML = `<div class="fav-empty">Nenhum favorito ainda — clique no ícone ⭐ dentro dos detalhes de um app pra fixar ele aqui.</div>`;
      return;
    }
    row.innerHTML = '';
    favApps.forEach(app => {
      const chip = document.createElement('div');
      chip.className = 'fav-chip';
      chip.style.borderColor = app.color + '88';
      chip.innerHTML = `<span class="material-symbols-outlined" style="color:${app.color}">${app.icon}</span>${app.name}`;
      chip.addEventListener('click', () => selectApp(app.i));
      row.appendChild(chip);
    });
  }

  function selectApp(i) {
    selected = i;
    nodeEls.forEach((n, idx) => n.classList.toggle('active', idx === i));
    spokeEls.forEach((s, idx) => {
      if (idx === i) { s.el.style.width = s.len + 'px'; s.el.classList.add('show'); }
      else { s.el.style.width = '0px'; s.el.classList.remove('show'); }
    });
    renderWheelCenter();
    renderDetail();
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    apps.forEach((app, i) => {
      const match = !q || app.name.toLowerCase().includes(q) || app.sub.toLowerCase().includes(q);
      nodeEls[i].classList.toggle('dimmed', !match);
      mRows[i].classList.toggle('hidden-row', !match);
    });
  });

  renderWheelCenter();
  renderDetail();
  renderFavorites();

  const body = document.body;
  const optLight = document.getElementById('optLight');
  const optDark = document.getElementById('optDark');
  function setTheme(mode) {
    body.setAttribute('data-theme', mode);
    optLight.classList.toggle('selected', mode==='light');
    optDark.classList.toggle('selected', mode==='dark');
  }
  optLight.addEventListener('click', () => setTheme('light'));
  optDark.addEventListener('click', () => setTheme('dark'));
  setTheme('light');
</script>

</body>
</html>
